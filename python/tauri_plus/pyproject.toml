[project]
name = "tauri-plus"
version = "0.0.0"
description = "Tauri+ Python runtime: @expose decorator, protocol server, task runner, cancellation, schema export"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tauri_plus"]

[tool.uv]
package = true

[tool.ruff]
src = ["src", "tests"]
