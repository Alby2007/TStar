name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: JS (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          # cli codegen tests spawn `python -m pylair.codegen`;
          # pylair needs 3.12+ (PEP 695 syntax)
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          # e2e tests spawn the real runtime; pylair needs 3.12+
          # (PEP 695 syntax). Matches the bundled-runtime version class.
          python-version: "3.12"
      - name: Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build
      - run: cargo test

  python:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - working-directory: python/pylair
        run: |
          uv sync --frozen
          uv run ruff check src tests
          uv run ruff format --check src tests
          uv run pytest -q

  # M0 feasibility spike: build installers bundling python-build-standalone
  # + a uv-locked env on all three OSes, then prove the bundled payload runs
  # with no system Python. See spikes/m0-packaging/README.md.
  m0-spike:
    name: M0 installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: "appimage,deb"
          - os: windows-latest
            bundles: "nsis"
          - os: macos-latest
            bundles: "app,dmg"
    defaults:
      run:
        working-directory: spikes/m0-packaging
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spikes/m0-packaging/src-tauri
      - name: Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Stage bundled resources (interpreter + locked env)
        run: pnpm stage
      - name: Verify staged payload before bundling
        if: runner.os != 'Windows'
        run: ./scripts/verify-bundled.sh src-tauri/resources
      - name: Verify staged payload before bundling (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-bundled.ps1 -Root src-tauri/resources
      - name: Build installers
        run: pnpm tauri build --bundles ${{ matrix.bundles }}
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: m0-${{ matrix.os }}
          path: spikes/m0-packaging/src-tauri/target/release/bundle/**
          if-no-files-found: error
      - name: Clean-machine check (bare ubuntu:22.04 container, no Python)
        if: runner.os == 'Linux'
        run: |
          # Extract the deb payload: no FUSE, no execution, deterministic —
          # unlike running --appimage-extract on a shared runner.
          DEB=$(find src-tauri/target/release/bundle/deb -name '*.deb' | head -1)
          echo "installer: $DEB"
          dpkg -x "$DEB" /tmp/debroot
          RESROOT=/tmp/debroot/usr/lib/m0-packaging-spike
          ls "$RESROOT"
          # Bare ubuntu:22.04 has no Python and none of the app's GUI libs —
          # if the payload runs here, it runs on a clean machine.
          for i in 1 2 3; do docker pull ubuntu:22.04 && break || sleep 15; done
          docker run --rm \
            -v "$RESROOT:/bundle:ro" \
            -v "$PWD/scripts/verify-bundled.sh:/verify.sh:ro" \
            ubuntu:22.04 bash /verify.sh /bundle
      - name: Clean-machine check (installed .app payload)
        if: runner.os == 'macOS'
        run: |
          APP=$(find src-tauri/target/release/bundle/macos -name '*.app' | head -1)
          ./scripts/verify-bundled.sh "$APP/Contents/Resources"
      - name: Clean-machine check (silent NSIS install + payload)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*-setup.exe' | Select-Object -First 1
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait
          # Locate the bundled interpreter wherever NSIS put the install dir.
          $py = Get-ChildItem "$env:LOCALAPPDATA","$env:ProgramFiles","${env:ProgramFiles(x86)}" `
                -Recurse -Filter 'python.exe' -Depth 4 -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -like '*m0-packaging-spike*' } | Select-Object -First 1
          if (-not $py) { Write-Error 'installed bundled python.exe not found'; exit 1 }
          Write-Output "bundled interpreter: $($py.FullName)"
          $resroot = Split-Path (Split-Path $py.FullName -Parent) -Parent
          ./scripts/verify-bundled.ps1 -Root $resroot

  # The one-command story, proven: scaffold a fresh app, build a native
  # installer bundling Python, install/extract on a clean machine, and call
  # the app's Python through the bundled interpreter — no system Python.
  acceptance:
    name: acceptance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: "appimage,deb"
          - os: windows-latest
            bundles: "nsis"
          - os: macos-latest
            bundles: "app,dmg"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app-under-test/src-tauri
      - name: Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Build workspace packages (client + cli + scaffolder dists)
        run: |
          pnpm install --frozen-lockfile
          pnpm -r build
      - name: Scaffold app (local dep wiring)
        run: node packages/create-pylair/dist/index.js app-under-test --local "$PWD"
      - name: Install app deps
        working-directory: app-under-test
        run: pnpm install --no-frozen-lockfile && uv sync
      - name: pylair build (stages interpreter, env, prunes, tauri build)
        working-directory: app-under-test
        run: pnpm exec pylair build --bundles ${{ matrix.bundles }}
      - name: Self-test installed app (Linux, clean container, no Python)
        if: runner.os == 'Linux'
        working-directory: app-under-test
        run: |
          DEB=$(find src-tauri/target/release/bundle/deb -name '*.deb' | head -1)
          dpkg -x "$DEB" /tmp/approot
          for i in 1 2 3; do docker pull ubuntu:22.04 && break || sleep 15; done
          # Bare ubuntu:22.04 has NO python — the binary is a GUI binary so it
          # needs its linked system libs, but --self-test exits before the
          # Tauri loop/GTK init. It must spawn the bundled interpreter.
          docker run --rm -v /tmp/approot:/r:ro ubuntu:22.04 bash -c '
            set -e; export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq libwebkit2gtk-4.1-0 libgtk-3-0 libayatana-appindicator3-1 librsvg2-2 ca-certificates >/dev/null
            /r/usr/bin/app-under-test --self-test'
      - name: Self-test installed app (macOS)
        if: runner.os == 'macOS'
        working-directory: app-under-test
        run: |
          APP=$(find src-tauri/target/release/bundle/macos -name '*.app' | head -1)
          env -i HOME="$HOME" PATH=/usr/bin:/bin "$APP/Contents/MacOS/app-under-test" --self-test
      - name: Self-test installed app (Windows)
        if: runner.os == 'Windows'
        working-directory: app-under-test
        shell: pwsh
        run: |
          $i = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*-setup.exe' | Select-Object -First 1
          Start-Process -FilePath $i.FullName -ArgumentList '/S' -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA","$env:ProgramFiles" `
                -Recurse -Filter 'app-under-test.exe' -Depth 3 -ErrorAction SilentlyContinue |
                Select-Object -First 1
          if (-not $exe) { Write-Error 'installed app-under-test.exe not found'; exit 1 }
          & $exe.FullName --self-test
          if ($LASTEXITCODE -ne 0) { Write-Error "self-test exit $LASTEXITCODE"; exit 1 }
