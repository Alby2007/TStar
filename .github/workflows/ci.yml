name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: JS (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build
      - run: cargo test

  python:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - working-directory: python/tauri_plus
        run: |
          uv sync --frozen
          uv run ruff check src tests
          uv run ruff format --check src tests
          uv run pytest -q

  # M0 feasibility spike: build installers bundling python-build-standalone
  # + a uv-locked env on all three OSes, then prove the bundled payload runs
  # with no system Python. See spikes/m0-packaging/README.md.
  m0-spike:
    name: M0 installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: "appimage,deb"
          - os: windows-latest
            bundles: "nsis"
          - os: macos-latest
            bundles: "app,dmg"
    defaults:
      run:
        working-directory: spikes/m0-packaging
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spikes/m0-packaging/src-tauri
      - name: Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Stage bundled resources (interpreter + locked env)
        run: pnpm stage
      - name: Verify staged payload before bundling
        if: runner.os != 'Windows'
        run: ./scripts/verify-bundled.sh src-tauri/resources
      - name: Build installers
        run: pnpm tauri build --bundles ${{ matrix.bundles }}
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: m0-${{ matrix.os }}
          path: spikes/m0-packaging/src-tauri/target/release/bundle/**
          if-no-files-found: error
      - name: Clean-machine check (bare ubuntu:22.04 container, no Python)
        if: runner.os == 'Linux'
        run: |
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' | head -1)
          chmod +x "$APPIMAGE"
          "$APPIMAGE" --appimage-extract
          RESROOT=$(dirname "$(dirname "$(find squashfs-root -type f -path '*/python/bin/python3' | head -1)")")
          echo "bundled resource root: $RESROOT"
          docker run --rm \
            -v "$PWD/$RESROOT:/bundle:ro" \
            -v "$PWD/scripts/verify-bundled.sh:/verify.sh:ro" \
            ubuntu:22.04 bash /verify.sh /bundle
      - name: Clean-machine check (installed .app payload)
        if: runner.os == 'macOS'
        run: |
          APP=$(find src-tauri/target/release/bundle/macos -name '*.app' | head -1)
          ./scripts/verify-bundled.sh "$APP/Contents/Resources"
      - name: Clean-machine check (silent NSIS install + payload)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*-setup.exe' | Select-Object -First 1
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait
          # Locate the bundled interpreter wherever NSIS put the install dir.
          $py = Get-ChildItem "$env:LOCALAPPDATA","$env:ProgramFiles","${env:ProgramFiles(x86)}" `
                -Recurse -Filter 'python.exe' -Depth 4 -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -like '*m0-packaging-spike*' } | Select-Object -First 1
          if (-not $py) { Write-Error 'installed bundled python.exe not found'; exit 1 }
          $resroot = Split-Path (Split-Path $py.FullName -Parent) -Parent
          ./scripts/verify-bundled.ps1 -Root $resroot
