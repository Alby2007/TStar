name: Publish crates

# Manual dispatch only: publishing is a deliberate act. Requires the
# CARGO_REGISTRY_TOKEN repo secret (crates.io API token). The first
# publish of a crate needs a token; switch to trusted publishing after it.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Crate version to publish (e.g. 0.1.0 or 0.1.0-rc.1)"
        required: true
      dry_run:
        description: "Package + verify only, do not upload"
        type: boolean
        default: true

jobs:
  publish:
    # macOS: the dry-run verify step COMPILES the packaged crate — on Linux
    # that needs GTK/webkit system packages; on macOS it works with system
    # frameworks alone. The uploaded tarball is identical either way, and
    # ci.yml already compiles the crate on all three OSes.
    runs-on: macos-latest
    permissions:
      contents: write # tag after a successful upload — never commits to main
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Check version matches Cargo.toml
        # The version lives in the repo, bumped by a normal commit — the
        # job only verifies it, never pushes to main.
        run: |
          repo_ver=$(grep '^version = ' crates/tauri-plugin-pylair/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          [ "$repo_ver" = "${{ inputs.version }}" ] || {
            echo "input '${{ inputs.version }}' != Cargo.toml '$repo_ver' — bump the version in a normal commit first"
            exit 1
          }

      - name: Package + verify (always, even for real publishes)
        run: cargo publish -p tauri-plugin-pylair --dry-run

      - name: Publish to crates.io
        if: ${{ !inputs.dry_run }}
        run: cargo publish -p tauri-plugin-pylair

      # Tag only runs if the upload above succeeded — a failed publish
      # leaves nothing behind.
      - name: Tag the release
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "tauri-plugin-pylair-v${{ inputs.version }}" -m "tauri-plugin-pylair ${{ inputs.version }}"
          git push origin "tauri-plugin-pylair-v${{ inputs.version }}"
