name: Publish npm packages

# Manual dispatch only. Publishes @pylair/client, @pylair/cli and
# create-pylair in dependency order under the `next` dist-tag, so
# `npm create pylair` keeps resolving `latest` (nothing) until a stable
# release. RC users run `npm create pylair@next` / `npm i @pylair/client@next`.
# Requires the NPM_TOKEN repo secret (npm granular access token with
# publish on the three packages — create it AFTER registering the
# @pylair scope, or use an automation token).
# Runs inside the `npm` environment if you create one (recommended:
# required reviewers before any registry write).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version for all three packages (e.g. 0.1.0 or 0.1.0-rc.1)"
        required: true
      dry_run:
        description: "Pack only, do not upload"
        type: boolean
        default: true

jobs:
  publish:
    environment: npm
    runs-on: ubuntu-22.04
    permissions:
      contents: write # tag after a successful upload — never commits to main
      id-token: write # --provenance attestations
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Check all three versions match the input
        # Versions live in the repo, bumped by a normal commit — the job
        # only verifies, never pushes to main.
        run: |
          for p in packages/client packages/cli packages/create-pylair; do
            repo_ver=$(grep '"version":' "$p/package.json" | head -1 | sed 's/.*"\([0-9][^"]*\)".*/\1/')
            [ "$repo_ver" = "${{ inputs.version }}" ] || {
              echo "input '${{ inputs.version }}' != $p/package.json '$repo_ver' — bump versions in a normal commit first"
              exit 1
            }
          done

      - name: Dry-run pack (always)
        run: |
          # --tag next here too so the log prints the real tag, not the
          # misleading default 'latest'.
          for p in packages/client packages/cli packages/create-pylair; do
            (cd "$p" && npm publish --access public --tag next --dry-run)
          done

      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        run: |
          # client first — cli and create-pylair may reference it.
          # --tag next: RCs must not become `latest` (npm still sets
          # latest on a package's very first publish — harmless here).
          # npm has no --skip-existing: a mid-loop failure leaves earlier
          # packages published, so skip what's already live on a rerun.
          for p in packages/client packages/cli packages/create-pylair; do
            name=$(node -p "require('./$p/package.json').name")
            if npm view "$name@${{ inputs.version }}" version >/dev/null 2>&1; then
              echo "$name@${{ inputs.version }} already published — skipping"
            else
              (cd "$p" && npm publish --access public --provenance --tag next)
            fi
            # `latest` must move to every new release or `npm create pylair`
            # keeps handing out the first (buggier) RC — while there's no
            # stable, newest RC is what we want latest to mean. Idempotent,
            # so it also heals a tag left behind by a partial run.
            npm dist-tag add "$name@${{ inputs.version }}" latest
          done

      - name: Tag the release
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "npm-v${{ inputs.version }}" -m "npm packages ${{ inputs.version }}"
          git push origin "npm-v${{ inputs.version }}"
