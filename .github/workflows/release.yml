name: Publish to PyPI

# Manual dispatch only. No long-lived tokens: each job uses OIDC trusted
# publishing through a protected environment.
#
# One-time setup (repo Settings → Environments, then pypi.org):
#   - create environments `pypi` and `pypi-ollama` (add required-reviewers
#     rules for extra safety)
#   - on pypi.org → Account → Publishing, add a trusted publisher per
#     package: owner PylairHQ, repo Pylair, workflow release.yml,
#     environment pypi (for `pylair`) / pypi-ollama (for `pylair-ollama`)
on:
  workflow_dispatch:
    inputs:
      package:
        description: "Which package to publish"
        type: choice
        options: [pylair, pylair-ollama, both]
        required: true
      version:
        description: "Version to publish (e.g. 0.1.0 or 0.1.0rc1)"
        required: true
      dry_run:
        description: "Build + check only, do not upload"
        type: boolean
        default: true

permissions:
  contents: write # tag after a successful upload — never commits to main

jobs:
  publish-pylair:
    # A dry run always builds BOTH packages — packaging bugs shouldn't
    # hide behind the selector until a real publish finds them.
    if: ${{ inputs.dry_run || inputs.package == 'pylair' || inputs.package == 'both' }}
    environment: pypi
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write # OIDC trusted publishing
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7

      - name: Check version matches pyproject.toml
        # The version lives in the repo, bumped by a normal commit — the
        # job only verifies it, never pushes to main.
        run: |
          repo_ver=$(grep '^version = ' python/pylair/pyproject.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          [ "$repo_ver" = "${{ inputs.version }}" ] || {
            echo "input '${{ inputs.version }}' != pyproject.toml '$repo_ver' — bump the version in a normal commit first"
            exit 1
          }

      - name: Build wheel + sdist
        run: cd python/pylair && uv build

      - name: Check the distribution
        run: uvx twine check python/pylair/dist/*

      - name: Publish to PyPI
        if: ${{ !inputs.dry_run }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/pylair/dist

      # Tag only runs if the upload above succeeded — a failed publish
      # leaves nothing behind.
      - name: Tag the release
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "pylair-v${{ inputs.version }}" -m "pylair ${{ inputs.version }}"
          git push origin "pylair-v${{ inputs.version }}"

  publish-ollama:
    if: ${{ inputs.dry_run || inputs.package == 'pylair-ollama' || inputs.package == 'both' }}
    environment: pypi-ollama
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write # OIDC trusted publishing
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7

      - name: Check version matches pyproject.toml
        run: |
          repo_ver=$(grep '^version = ' integrations/ollama/pyproject.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          [ "$repo_ver" = "${{ inputs.version }}" ] || {
            echo "input '${{ inputs.version }}' != pyproject.toml '$repo_ver' — bump the version in a normal commit first"
            exit 1
          }

      - name: Build wheel + sdist
        run: cd integrations/ollama && uv build

      - name: Check the distribution
        run: uvx twine check integrations/ollama/dist/*

      - name: Publish to PyPI
        if: ${{ !inputs.dry_run }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: integrations/ollama/dist

      - name: Tag the release
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "pylair-ollama-v${{ inputs.version }}" -m "pylair-ollama ${{ inputs.version }}"
          git push origin "pylair-ollama-v${{ inputs.version }}"
