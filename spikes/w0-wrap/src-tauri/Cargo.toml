[package]
name = "w0-wrap"
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
publish = false

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "w0_wrap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
url = "2"
tauri-plugin-pylair = { path = "../../../crates/tauri-plugin-pylair" }

[features]
default = []
