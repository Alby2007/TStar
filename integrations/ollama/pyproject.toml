[project]
name = "pylair-ollama"
version = "0.0.0"
description = "Optional Ollama integration for Pylair apps: detect, status, stream completions through the normal bridge"
license = "MIT OR Apache-2.0"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pylair_ollama"]

[tool.uv]
package = true

[tool.ruff]
src = ["src", "tests"]
